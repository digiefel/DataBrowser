<style>
#db-selected-step {
  color-scheme: light dark;
  --db-bg: light-dark(#e9e9ec, #242424);
  --db-panel: light-dark(#fafafa, #2d2d2d);
  --db-title: light-dark(#d9e4f0, #284c72);
  --db-control: light-dark(#e1e4e8, #41464e);
  --db-hover: light-dark(#d7e6f6, #355b81);
  --db-text: light-dark(#202327, #eeeeef);
  --db-muted: light-dark(#58616c, #b2b6bd);
  --db-line: light-dark(#b9bec5, #60646b);
  --db-selected: light-dark(#d6e7f8, #345575);
  --db-focus: light-dark(#275f9b, #8dbce9);
  color: var(--db-text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif;
}
#db-selected-step * { box-sizing: border-box; }
#db-selected-step [hidden] { display: none !important; }
#db-selected-step .db-workspace { background: var(--db-bg); padding: 8px; display: grid; grid-template-columns: 1fr 1.12fr; gap: 8px; align-items: start; }
#db-selected-step .db-window { background: var(--db-panel); border: 1px solid var(--db-line); min-width: 0; }
#db-selected-step .db-title { background: var(--db-title); padding: 4px 6px; display: flex; gap: 8px; align-items: center; }
#db-selected-step .db-title-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#db-selected-step button, #db-selected-step summary, #db-selected-step select, #db-selected-step input { font: inherit; color: var(--db-text); }
#db-selected-step button, #db-selected-step summary, #db-selected-step select { background: var(--db-control); padding: 3px 7px; border: 0; border-radius: 0; }
#db-selected-step button:hover, #db-selected-step summary:hover { background: var(--db-hover); }
#db-selected-step button:focus-visible, #db-selected-step summary:focus-visible, #db-selected-step select:focus-visible { outline: 2px solid var(--db-focus); outline-offset: 2px; }
#db-selected-step .db-menu { position: relative; }
#db-selected-step summary { list-style: none; }
#db-selected-step summary::-webkit-details-marker { display: none; }
#db-selected-step .db-popover { position: absolute; z-index: 5; top: calc(100% + 5px); right: 0; background: var(--db-panel); border: 1px solid var(--db-line); padding: 10px; width: 265px; max-width: 80vw; }
#db-selected-step .db-popover label { display: grid; grid-template-columns: 75px minmax(0,1fr); gap: 8px; align-items: center; margin: 8px 0; }
#db-selected-step .db-popover select { width: 100%; }
#db-selected-step .db-popover .db-check { display: flex; }
#db-selected-step .db-popover hr { border: 0; border-top: 1px solid var(--db-line); margin: 10px 0; }
#db-selected-step .db-toolbar { padding: 7px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--db-line); }
#db-selected-step .db-toolbar label { display: flex; align-items: center; gap: 4px; }
#db-selected-step .db-toolbar .db-popover { left: 0; right: auto; }
#db-selected-step .db-body { padding: 10px; min-height: 200px; }
#db-selected-step .db-row { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 7px; width: 100%; padding: 10px 7px; text-align: left; background: transparent; position: relative; }
#db-selected-step .db-row + .db-row::before { content: ''; position: absolute; left: 15px; top: -7px; height: 18px; width: 1px; background: var(--db-muted); }
#db-selected-step .db-row[aria-pressed=true] { background: var(--db-selected); }
#db-selected-step .db-row-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
#db-selected-step .db-source { color: var(--db-muted); margin-left: 10px; white-space: nowrap; }
#db-selected-step .db-info { border-top: 1px solid var(--db-line); padding: 12px; }
#db-selected-step .db-info-title { margin: 0 0 12px; font-weight: 500; }
#db-selected-step dl { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 9px 22px; margin: 0; }
#db-selected-step dt { color: var(--db-muted); }
#db-selected-step dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
#db-selected-step .db-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
#db-selected-step .db-table { width: 100%; border-collapse: collapse; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
#db-selected-step .db-table th { font-weight: 500; text-align: right; border-bottom: 1px solid var(--db-line); padding: 5px 3px; }
#db-selected-step .db-table td { padding: 7px 3px; text-align: right; }
#db-selected-step .db-table tr:nth-child(even) { background: color-mix(in srgb, var(--db-text) 5%, transparent); }
#db-selected-step .db-table .db-left { text-align: left; }
#db-selected-step pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0; font: inherit; }
#db-selected-step .db-context { color: var(--db-muted); padding: 6px 10px; border-top: 1px solid var(--db-line); }
@media (max-width: 650px) {
  #db-selected-step .db-workspace { grid-template-columns: 1fr; }
  #db-selected-step .db-source { display: block; margin: 2px 0 0; }
  #db-selected-step dl { gap: 8px 12px; }
}
@media (pointer: coarse) {
  #db-selected-step button, #db-selected-step summary, #db-selected-step select { min-height: 44px; }
}
</style>
<div id="db-selected-step">
  <div class="db-workspace">
    <section class="db-window" aria-label="Code window">
      <div class="db-title"><span class="db-title-text">Code 1 · RobinOld35c1_…_PUND.csv</span>
        <details class="db-menu"><summary class="cursor-interaction">Window ▾</summary><div class="db-popover">
          <label>Input<select aria-label="Code input"><option>Selection</option></select></label>
          <label>Process<select aria-label="Code input process"><option>None</option><option>Choose process…</option></select></label>
          <label class="db-check"><input type="checkbox" checked>Follow item selection</label>
          <hr><label>Arrangement<select aria-label="Code arrangement"><option>Overlay</option><option>Stack</option><option>Grid</option></select></label>
          <button type="button" data-export>Export…</button>
        </div></details>
      </div>
      <div aria-label="Computation steps">
        <button type="button" class="db-row cursor-interaction" data-step="0" aria-pressed="false"><span>●</span><span><span class="db-row-name">read(::SourceFile)</span><span class="db-source">browse_data.jl:13 ↗</span></span></button>
        <button type="button" class="db-row cursor-interaction" data-step="1" aria-pressed="true"><span>●</span><span><span class="db-row-name">process(::pund)</span><span class="db-source">browse_data.jl:13 ↗</span></span></button>
        <button type="button" class="db-row cursor-interaction" data-step="2" aria-pressed="false"><span>●</span><span><span class="db-row-name">analyze(::pund)</span><span class="db-source">browse_data.jl:13 ↗</span></span></button>
      </div>
      <div class="db-info" aria-live="polite"><p class="db-info-title" data-detail-title>process(::pund)</p><dl data-step-details></dl></div>
    </section>
    <section class="db-window" aria-label="Ordinary visualizer following the Code window">
      <div class="db-title"><span class="db-title-text" data-view-title>Table 1 · RobinOld35c1_…_PUND.csv</span>
        <details class="db-menu"><summary class="cursor-interaction">Window ▾</summary><div class="db-popover">
          <label>Visualizer<select data-visualizer aria-label="Linked visualizer"><option>Table</option><option>Value</option></select></label>
          <label>Input<select data-input aria-label="Linked window input"><option value="code">Code 1</option><option value="selection">Selection</option></select></label>
          <label>Process<select aria-label="Linked input process"><option>None</option><option>Choose process…</option></select></label>
          <label class="db-check" data-follow hidden><input type="checkbox" checked>Follow item selection</label>
          <hr><label>Arrangement<select aria-label="Linked window arrangement"><option>Stack</option><option>Grid</option><option>Overlay</option></select></label>
          <button type="button" data-export>Export…</button>
        </div></details>
      </div>
      <div class="db-toolbar" data-table-controls>
        <details class="db-menu"><summary class="cursor-interaction">Columns ▾</summary><div class="db-popover" data-column-options></div></details>
        <details class="db-menu"><summary class="cursor-interaction">Metadata ▾</summary><div class="db-popover"><label class="db-check"><input type="checkbox" data-show-item>Item label</label></div></details>
        <label><input type="checkbox" checked data-group>Group by item</label>
      </div>
      <div class="db-body" data-view-body aria-live="polite"></div>
      <div class="db-context" data-item-label hidden>RobinOld35c1_…_PUND.csv</div>
    </section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('db-selected-step');
  const steps = [
    {name:'read(::SourceFile)', cache:'Yes — disk, 3.8 MiB', time:'64 ms', date:'28 Oct, 15:12:44', type:'NamedTuple', columns:['time_s','V','I'], rows:[[0.0,0.0,'1.0e-6'],[0.1,0.5,'1.4e-6'],[0.2,1.0,'0.8e-6'],[0.3,0.5,'-1.0e-6']]},
    {name:'process(::pund)', cache:'Yes — memory, 2.4 MiB', time:'18 ms', date:'28 Oct, 15:12:45', type:'pund', columns:['loop','V','I_FE','Q'], rows:[[1,'32.563e-3','-1.469e-6','2.479e-12'],[1,'34.115e-3','161.614e-9','2.495e-12'],[1,'35.666e-3','-76.905e-9','2.419e-12'],[1,'38.310e-3','-231.207e-9','2.395e-12']]},
    {name:'analyze(::pund)', cache:'Yes — memory, 512 B', time:'1.2 ms', date:'28 Oct, 15:12:46', type:'Dict', columns:['name','value'], rows:[['peak_current','1.47e-6'],['loop_count',1]]}
  ];
  const state = {step:1, input:'code', visualizer:'Table', hidden:[], showItem:false};
  function restore(snapshot) {
    const saved=snapshot?.privateContent?.selectedStep;
    if(!saved) return;
    if([0,1,2].includes(saved.step))state.step=saved.step;
    if(['code','selection'].includes(saved.input))state.input=saved.input;
    if(['Table','Value'].includes(saved.visualizer))state.visualizer=saved.visualizer;
    state.hidden=Array.isArray(saved.hidden)?saved.hidden.filter(x=>typeof x==='string'):[];
    state.showItem=Boolean(saved.showItem);
  }
  function save() {
    window.openai?.setWidgetState?.({modelContent:{design:'Code selection supplies a Computable',step:steps[state.step].name,input:state.input,visualizer:state.visualizer},privateContent:{selectedStep:state}})?.catch(()=>{});
  }
  function renderValue() {
    const step=steps[state.input==='code'?state.step:1];
    const indexes=step.columns.map((_,i)=>i).filter(i=>!state.hidden.includes(step.columns[i]));
    root.querySelector('[data-view-title]').textContent=state.visualizer+' 1 · RobinOld35c1_…_PUND.csv';
    root.querySelector('[data-table-controls]').hidden=state.visualizer!=='Table';
    root.querySelector('[data-item-label]').hidden=!state.showItem;
    root.querySelector('[data-follow]').hidden=state.input!=='selection';
    root.querySelector('[data-visualizer]').value=state.visualizer;
    root.querySelector('[data-input]').value=state.input;
    root.querySelector('[data-show-item]').checked=state.showItem;
    const body=root.querySelector('[data-view-body]');
    if(state.visualizer==='Value') {
      const pre=document.createElement('pre');pre.className='db-mono';
      pre.textContent=step.columns.map((name,i)=>name+' = ['+step.rows.map(row=>row[i]).join(', ')+']').join('\n');
      body.replaceChildren(pre);
    } else {
      body.innerHTML=`<table class="db-table" aria-label="Illustrative data supplied through the ordinary window input"><thead><tr>${indexes.map(i=>`<th>${step.columns[i]}</th>`).join('')}</tr></thead><tbody>${step.rows.map(row=>`<tr>${indexes.map(i=>`<td class="${i===0&&state.step===2?'db-left':''}">${row[i]}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }
    const options=root.querySelector('[data-column-options]');
    options.innerHTML=step.columns.map(c=>`<label class="db-check"><input type="checkbox" value="${c}" ${state.hidden.includes(c)?'':'checked'}>${c}</label>`).join('');
    options.querySelectorAll('input').forEach(input=>input.onchange=()=>{state.hidden=state.hidden.filter(x=>x!==input.value);if(!input.checked)state.hidden.push(input.value);renderValue();save();});
  }
  function render() {
    const step=steps[state.step];
    root.querySelectorAll('[data-step]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.step)===state.step)));
    root.querySelector('[data-detail-title]').textContent=step.name;
    const details=[['State','Current'],['Cached',step.cache],['Last execution',`${step.time} (${step.date})`],['Inputs','1'],['Output type',step.type]];
    root.querySelector('[data-step-details]').innerHTML=details.map(([label,value])=>`<dt>${label}</dt><dd>${value}</dd>`).join('');
    renderValue();
  }
  root.querySelectorAll('[data-step]').forEach(button=>button.onclick=()=>{state.step=Number(button.dataset.step);state.hidden=[];render();save();});
  root.querySelector('[data-visualizer]').onchange=event=>{state.visualizer=event.target.value;renderValue();save();};
  root.querySelector('[data-input]').onchange=event=>{state.input=event.target.value;state.hidden=[];renderValue();save();};
  root.querySelector('[data-show-item]').onchange=event=>{state.showItem=event.target.checked;renderValue();save();};
  root.querySelector('[data-group]').onchange=event=>{root.querySelector('[data-view-body]').dataset.grouped=String(event.target.checked);};
  root.querySelectorAll('[data-export]').forEach(button=>button.onclick=()=>{button.textContent='Export current view…';});
  restore(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
})();
</script>
