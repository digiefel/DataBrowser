</style></head><body><main class="window">
<div class="header"><span>Plot</span><span class="dim">from</span><button class="quiet">Selection ▾</button><label class="live"><input id="live" type="checkbox" checked>Live</label><span class="spacer"></span><button class="quiet" id="editorToggle">Editor</button><button class="quiet" id="codeToggle">Code</button><button class="quiet" id="rightToggle">Inspector</button><button class="quiet" id="export">Export</button></div>
<div class="workspace"><aside class="left" id="left"><div class="panel-heading">Editor</div><div id="editor"></div></aside><div class="plot"><svg viewBox="0 0 730 398" id="chart"></svg></div><aside class="right" id="right"><div class="panel-heading">Inspector</div><div id="side"></div></aside></div>
<div class="code" id="code"></div><div class="status"><span id="status">Live</span><span class="spacer"></span><span>12 observations</span></div></main>
<script>
const isTLM=new URLSearchParams(location.search).get('scene')==='tlm';
const state={x:'x',y:'y',color:'series',width:2,prefix:'Gain = ',field:'slope',digits:2,fontsize:13,offsetX:8,offsetY:0,align:'left',site:0,threshold:.99,selected:'text',tab:'inspector'};
if(isTLM)Object.assign(state,{prefix:'R_c = ',field:'intercept',digits:1,fontsize:12});
const columns={x:[1,2,3,4,5,6,1,2,3,4,5,6],y:[3.2,4.7,7.1,9.1,10.7,13.2,3.38,3.16,2.46,1.96,1.66,.88],series:['A','A','A','A','A','A','B','B','B','B','B','B']};
if(isTLM)columns.y=[8.2,9.7,12.1,14.1,15.7,18.2,13.8,14.8,19.4,22.4,23.8,28.8];
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;');
const num=(key,extra='')=>`<input type="number" class="num" ${key==='threshold'?'style="width:65px"':''} data-key="${key}" value="${state[key]}" ${extra}>`;
const select=(key,options,cl='field')=>`<select class="${cl}" ${key==='field'?'style="width:'+Math.max(72,state[key].length*8+32)+'px"':''} data-key="${key}">${options.map(v=>`<option value="${v}" ${state[key]===v?'selected':''}>${['x','y','color','align'].includes(key)&&v!=='nothing'?':':''}${v}</option>`).join('')}</select>`;
const expression=(wrap=false)=>`<span class="str">"</span><input class="literal" style="width:calc(${state.prefix.length}ch + 7px)" data-key="prefix" aria-label="Label text" value="${esc(state.prefix)}"><span>$(round(${wrap?'<br> &nbsp;':''}fit.</span>${select('field',['slope','intercept'])}<span>${isTLM?' / 2':''};${wrap?'<br> &nbsp;':' '}digits=</span>${num('digits','min="0" max="8"')}<span>))</span><span class="str">${isTLM?' Ω':''}"</span>`;
let cacheKey='',models=[];function fit(){let key=[state.x,state.y,state.color,state.site].join('/');if(key===cacheKey)return models;cacheKey=key;let groups=state.color==='nothing'?['All']:['A','B'];models=groups.map(group=>{let ids=columns.x.map((_,i)=>i).filter(i=>group==='All'||columns.series[i]===group),x=ids.map(i=>columns[state.x][i]),y=ids.map(i=>columns[state.y][i]+(isTLM?2*state.site:0)),mx=x.reduce((a,b)=>a+b)/x.length,my=y.reduce((a,b)=>a+b)/y.length,s=x.reduce((a,v,i)=>a+(v-mx)*(y[i]-my),0)/x.reduce((a,v)=>a+(v-mx)**2,0);const intercept=my-s*mx,total=y.reduce((a,v)=>a+(v-my)**2,0),residual=x.reduce((a,v,i)=>a+(y[i]-intercept-s*v)**2,0);return{group,x,y,slope:s,intercept,r2:1-residual/total}});return models}
function source(){if(isTLM)return `@plot data(measurements) *
    mapping(:gap_um => "gap (µm)", :R_ohm => "R (Ω)"; color=:chip, col=:site) begin
    visual(Scatter; markersize=6)
    fit = linear(; interval=nothing) *
        subvisual(:prediction; linewidth=${state.width},
            linestyle=fit.r2 < ${state.threshold} ? :dash : :solid)
    mapping(fit.x[end], fit.y[end]) *
        visual(Text; text=${JSON.stringify(state.prefix).slice(0,-1)+'$(round(fit.'+state.field+' / 2; digits='+state.digits+')) Ω"'},
            fontsize=${state.fontsize}, offset=(${state.offsetX}, ${state.offsetY}), align=(:${state.align}, :center))
    mapping(0, fit.intercept) * visual(Scatter; marker=:xcross, markersize=12)
    mapping(; group=nothing, color=nothing) * linear(; interval=nothing) *
        subvisual(:prediction; color=:gray, linestyle=:dot)
end`;return `@plot data(table) * mapping(:${state.x}, :${state.y}; ${state.color==='nothing'?'group=nothing':'color=:series'}) begin
    visual(Scatter; markersize=6)
    fit = linear(; interval=nothing) *
        subvisual(:prediction; linewidth=${state.width})
    mapping(fit.x[end], fit.y[end]) *
        visual(Text; text=${JSON.stringify(state.prefix).slice(0,-1)+'$(round(fit.'+state.field+'; digits='+state.digits+'))"'},
            fontsize=${state.fontsize}, offset=(${state.offsetX}, ${state.offsetY}), align=(:${state.align}, :center))
end`}

function row(html,selected=false){return `<div class="row ${selected?'selected':''}">${html}</div>`}
function code(){if(isTLM){document.querySelector('#code').innerHTML=[
row(`<span class="syntax">@plot</span> <span class="call">data</span>(measurements) *`),
row(`    <span class="call">mapping</span>(<span class="symbol">:gap_um</span> =&gt; <span class="str">"gap (µm)"</span>, <span class="symbol">:R_ohm</span> =&gt; <span class="str">"R (Ω)"</span>; color=<span class="symbol">:chip</span>, col=<span class="symbol">:site</span>) <span class="syntax">begin</span>`),
row(`    <span class="call">visual</span>(Scatter; markersize=6)`),
row(`    fit = <span class="call">linear</span>(; interval=<span class="syntax">nothing</span>) *`,state.selected==='line'),
row(`        <span class="call">subvisual</span>(<span class="symbol">:prediction</span>; linewidth=${num('width','min="0.1" step="0.1"')},`,state.selected==='line'),
row(`            linestyle=fit.r2 &lt; ${num('threshold','min="0" max="1" step=".01"')} ? <span class="symbol">:dash</span> : <span class="symbol">:solid</span>)`,state.selected==='line'),
row(`    <span class="call">mapping</span>(fit.x[end], fit.y[end]) *`,state.selected==='text'),
row(`        <span class="call">visual</span>(Text; text=${expression()},`,state.selected==='text'),
row(`            fontsize=${num('fontsize','min="5" max="40"')}, offset=(${num('offsetX')}, ${num('offsetY')}), align=(:${state.align}, <span class="symbol">:center</span>))`,state.selected==='text'),
row(`    <span class="call">mapping</span>(0, fit.intercept) * <span class="call">visual</span>(Scatter; marker=<span class="symbol">:xcross</span>, markersize=12)`),
row(`    <span class="call">mapping</span>(; group=<span class="syntax">nothing</span>, color=<span class="syntax">nothing</span>) * <span class="call">linear</span>(; interval=<span class="syntax">nothing</span>) *`),
row(`        <span class="call">subvisual</span>(<span class="symbol">:prediction</span>; color=<span class="symbol">:gray</span>, linestyle=<span class="symbol">:dot</span>)`),
row(`<span class="syntax">end</span>`)].join('');return}
document.querySelector('#code').innerHTML=[row(`<span class="syntax">@plot</span> <span class="call">data</span>(table) * <span class="call">mapping</span>(${select('x',['x','y'],'role')}, ${select('y',['y','x'],'role')}; ${state.color==='series'?'color=':'group='}${select('color',['series','nothing'],'rolecolor')}) <span class="syntax">begin</span>`),row(`    <span class="call">visual</span>(Scatter; markersize=6)`),row(`    fit = <span class="call">linear</span>(; interval=<span class="syntax">nothing</span>) *`),row(`        <span class="call">subvisual</span>(<span class="symbol">:prediction</span>; linewidth=${num('width','min="0.1" step="0.1"')})`,state.selected==='line'),row(`    <span class="call">mapping</span>(fit.x[end], fit.y[end]) *`,state.selected==='text'),row(`        <span class="call">visual</span>(Text; text=${expression()},`,state.selected==='text'),row(`            fontsize=${num('fontsize','min="5" max="40"')}, offset=(${num('offsetX')}, ${num('offsetY')}),`,state.selected==='text'),row(`            align=(${select('align',['left','center','right'])}, <span class="symbol">:center</span>))`,state.selected==='text'),row(`<span class="syntax">end</span>`)].join('')}
function caption(m){const v=m[state.field]/(isTLM?2:1),n=Math.round(v*10**state.digits)/10**state.digits;return state.prefix+(Number.isInteger(n)?n.toFixed(1):String(n))+(isTLM?' Ω':'')}
function side(){let el=document.querySelector('#side');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));if(state.tab==='editor'){el.innerHTML=`<div class="entry"><label>x</label>${select('x',['x','y'])}</div><div class="entry"><label>y</label>${select('y',['y','x'])}</div><div class="entry"><label>color</label>${select('color',['series','nothing'])}</div><div class="divider"></div><div class="layer" data-pick="line"><span class="dim">◉</span> Scatter</div><div class="layer" data-pick="line"><span class="chip" style="background:#87a9d2"></span>fit · linear</div><div class="layer" data-pick="text"><span class="dim">T</span>Text</div><div class="divider"></div><div class="columns">x &nbsp;Float64<br>y &nbsp;Float64<br>series &nbsp;String</div>`;return}let m=fit();if(state.selected==='text'){el.innerHTML=`<div class="context"><span class="dim">T</span> Text <span class="tag">Shared · ${isTLM?'4 fits':m.length+' series'}</span></div><div class="entry"><label>text</label><span class="tag">code ↗</span></div><div class="expr">${expression(true)}</div>${isTLM?`<div class="entry"><label>site</label><select data-key="site"><option value="0" ${state.site===0?'selected':''}>Site 1</option><option value="1" ${state.site===1?'selected':''}>Site 2</option></select></div>`:''}<div class="computed">${m.map(f=>esc(f.group)+': '+esc(caption(f))).join('<br>')}</div><div class="entry"><label>fontsize</label>${num('fontsize','min="5" max="40"')}<span class="tag">code ↗</span></div><div class="entry"><label>color</label><span class="chip" style="background:#87a9d2"></span><span class="chip" style="background:#d7ad78"></span><span class="tag">mapping ↗</span></div><div class="entry"><label>offset</label><span class="preview">(${num('offsetX')}, ${num('offsetY')})</span><span class="tag">code ↗</span></div><div class="entry"><label>align</label>${select('align',['left','center','right'])}<span class="dim">:center</span><span class="tag">code ↗</span></div><div class="entry"><label>rotation</label><span class="dim">0</span><span class="tag">default</span></div>`}
else el.innerHTML=`<div class="context">Lines<span class="tag">Shared · ${m.length} series</span></div><div class="entry"><label>linewidth</label>${num('width','min="0.1" step="0.1"')}<span class="tag">code ↗</span></div>${isTLM?`<div class="entry"><label>linestyle</label><span class="tag">code ↗</span></div><div class="source">fit.r2 &lt; ${num('threshold','min="0" max="1" step=".01"')} ?<br>:dash : :solid</div><div class="computed">${m.map(f=>esc(f.group)+': '+(f.r2<state.threshold?':dash':':solid')).join('<br>')}</div>`:'<div class="entry"><label>linestyle</label><span class="dim">solid</span><span class="tag">default</span></div>'}<div class="entry"><label>color</label><span class="chip" style="background:#87a9d2"></span><span class="chip" style="background:#d7ad78"></span><span class="tag">mapping ↗</span></div><div class="entry"><label>alpha</label><span class="dim">1.0</span><span class="tag">default</span></div><div class="divider"></div><div class="source">fit · linear</div>${m.map(f=>`<div class="results">${f.group} &nbsp; slope ${f.slope.toFixed(2)}</div>`).join('')}`}
function draw(){let ms=fit(),xall=ms.flatMap(m=>m.x),yall=ms.flatMap(m=>m.y),xmin=Math.min(...xall)-.4,xmax=Math.max(...xall)+1.5,ymin=Math.min(...yall)-1,ymax=Math.max(...yall)+1.5,X=x=>57+(x-xmin)/(xmax-xmin)*625,Y=y=>351-(y-ymin)/(ymax-ymin)*320;let s='';for(let i=0;i<=6;i++){let v=Math.min(...yall)+(Math.max(...yall)-Math.min(...yall))*i/6,y=Y(v);s+=`<line x1="57" x2="684" y1="${y}" y2="${y}" stroke="#272d35"/><text x="45" y="${y+4}" text-anchor="end" fill="#9ba6b4" font-family="Lexend" font-size="11">${Math.round(v)}</text>`}s+='<text x="538" y="27" fill="#9ba6b4" font-family="Lexend" font-size="11">series</text>';s+='<path d="M57 27V351H684" fill="none" stroke="#808c9b"/>';for(let x=1;x<=6;x++)s+=`<text x="${X(x)}" y="372" text-anchor="middle" fill="#a1aab7" font-family="Lexend" font-size="11">${x}</text>`;s+=`<text x="362" y="392" fill="#c1cad6" font-family="Lexend" font-size="12">${state.x}</text><text x="18" y="200" fill="#c1cad6" font-family="Lexend" font-size="12">${state.y}</text>`;ms.forEach((m,j)=>{let col=j?'#d7ad78':'#87a9d2',lo=Math.min(...m.x),hi=Math.max(...m.x),ylo=m.intercept+m.slope*lo,yhi=m.intercept+m.slope*hi;s+=`<line data-pick="line" class="curve" x1="${X(lo)}" y1="${Y(ylo)}" x2="${X(hi)}" y2="${Y(yhi)}" stroke="${col}" stroke-width="${state.width}"/>`;m.x.forEach((x,i)=>{s+=`<circle data-pick="line" cx="${X(x)}" cy="${Y(m.y[i])}" r="3" fill="${col}"/>`});let caption=state.prefix+m[state.field].toFixed(state.digits);s+=`<text data-pick="text" class="textmark" x="${X(hi)+state.offsetX}" y="${Y(yhi)-state.offsetY+4}" fill="${col}" text-anchor="${state.align==='left'?'start':state.align==='right'?'end':'middle'}" font-family="Lexend" font-size="${state.fontsize}">${esc(caption)}</text>`;if(state.selected==='text')s+=`<rect data-pick="text" x="${X(hi)+4}" y="${Y(yhi)-13}" width="99" height="24" fill="none" stroke="${col}" stroke-opacity=".5" stroke-dasharray="2 3" rx="2"/>`;s+=`<circle cx="${590+j*47}" cy="23" r="3" fill="${col}"/><text x="${598+j*47}" y="27" fill="#b8c2d0" font-family="Lexend" font-size="11">${m.group}</text>`});document.querySelector('#chart').innerHTML=s}

function editor(){const schema=isTLM?[['gap_um','Float64'],['R_ohm','Float64'],['chip','String'],['site','String']]:[['x','Float64'],['y','Float64'],['series','String']];document.querySelector('#editor').innerHTML=(isTLM?
`<div class="entry"><label>x</label><select><option>:gap_um</option><option>:R_ohm</option></select></div><div class="entry"><label>y</label><select><option>:R_ohm</option><option>:gap_um</option></select></div><div class="entry"><label>color</label><select><option>:chip</option></select></div><div class="entry"><label>col</label><select><option>:site</option></select></div>`:
`<div class="entry"><label>x</label>${select('x',['x','y'])}</div><div class="entry"><label>y</label>${select('y',['y','x'])}</div><div class="entry"><label>color</label>${select('color',['series','nothing'])}</div>`)+
`<div class="entry"><label>group</label><span class="group-value">Auto</span></div><div class="divider"></div><div class="layer"><span class="dim">◉</span>Scatter</div><div class="layer ${state.selected==='line'?'active':''}" data-pick="line"><span class="dim">╱</span>fit · linear</div><div class="layer ${state.selected==='text'?'active':''}" data-pick="text"><span class="dim">T</span>Text</div>${isTLM?'<div class="layer"><span class="dim">×</span>Intercept</div><div class="layer"><span class="dim">⋯</span>Pooled fit</div>':''}<div class="divider"></div><input class="filter" id="columnFilter" placeholder="Filter columns…" aria-label="Filter columns"><div class="columns">${schema.map(([name,type])=>`<div class="column" data-column="${name}"><span>${name}</span><span>${type}</span></div>`).join('')}</div>`}

function render(){document.querySelector('#status').textContent=document.querySelector('#live').checked?'Live':'Paused';code();side();editor();if(document.querySelector('#live').checked&&!document.querySelector('.native'))draw()}
document.addEventListener('input',e=>{if(e.target.id==='columnFilter'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-column]').forEach(row=>row.classList.toggle('hidden',!row.dataset.column.toLowerCase().includes(q)))}});document.addEventListener('change',e=>{let k=e.target.dataset.key;if(!k)return;state[k]=['width','digits','fontsize','offsetX','offsetY','site','threshold'].includes(k)?Number(e.target.value):e.target.value;render()});document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){state.tab=t.dataset.tab;side()}let p=e.target.closest('[data-pick]');if(p){state.selected=p.dataset.pick;state.tab='inspector';render()}});document.querySelector('#editorToggle').onclick=()=>document.querySelector('#left').classList.toggle('hidden');document.querySelector('#codeToggle').onclick=()=>document.querySelector('#code').classList.toggle('hidden');document.querySelector('#rightToggle').onclick=()=>document.querySelector('#right').classList.toggle('hidden');document.querySelector('#live').onchange=()=>render();window.mockup={state,source,render,select:kind=>{state.selected=kind;state.tab='inspector';render()}};const picture=document.createElement('img');picture.className='native';picture.alt='Native Julia plot';picture.src=isTLM?'fit-tlm-native.png':'fit-generic-native.png';document.querySelector('.plot').append(picture);document.querySelector('#chart').style.display='none';if(isTLM){document.querySelector('.status span:last-child').textContent='24 observations';document.querySelector('#code').style.height='344px'}render();
</script></body></html>
