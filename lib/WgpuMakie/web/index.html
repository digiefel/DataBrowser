<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WgpuMakie Web Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 12px;
      border-bottom: 1px solid #d9dee5;
      background: #f6f8fa;
      font-size: 13px;
    }
    #canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    #wgpu-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #tooltip {
      position: absolute;
      pointer-events: none;
      display: none;
      background: rgba(24, 28, 34, 0.9);
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span id="status">Connecting...</span>
    <button id="copy-code" type="button">Copy Grafico Code</button>
  </div>
  <div id="canvas-wrap">
    <canvas id="wgpu-canvas"></canvas>
    <div id="tooltip"></div>
  </div>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
